# stdmeal — konfiguracja nginx dla obrazu produkcyjnego.
#
# Serwujemy dokładnie jeden plik, więc konfiguracja jest krótka, ale nie
# bezmyślna: nagłówki bezpieczeństwa, kompresja i osobny endpoint /healthz,
# żeby Docker (i homelabowy uptime-kuma) miały co odpytywać.

# log_format musi stać w kontekście http — a conf.d/*.conf jest w nim
# dołączany, więc definiujemy go tutaj, PRZED blokiem server.
# Bez adresów IP: to aplikacja domowa, a nie system analityczny.
log_format minimal '$time_iso8601 $status $request_method $uri';

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # —— bezpieczeństwo ——
    # Aplikacja to jeden plik z wbudowanym <style> i <script>, stąd
    # 'unsafe-inline'. Poza tym nie wolno jej absolutnie nic: żadnych
    # zewnętrznych skryptów, żadnych połączeń, żadnych formularzy.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Plik jest jeden i to on JEST aplikacja, wiec nigdy nie cache'ujemy go
    # na stale: inaczej po `docker compose pull` dalej widac stara wersje.
    add_header Cache-Control            "no-cache" always;

    # —— kompresja ——
    gzip              on;
    gzip_types        text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length   1024;
    gzip_comp_level   6;

    # UWAGA (wyłapane przez test dymny w CI): `add_header` w bloku `location`
    # NIE dokłada się do nagłówków z `server` — on je w całości zastępuje.
    # Dlatego osobny `location = /index.html` z samym Cache-Control zabierał
    # stronie głównej CSP i całą resztę. Wszystkie nagłówki siedzą teraz
    # wyłącznie na poziomie `server`.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— healthcheck ——
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # —— logi ——
    access_log  /dev/stdout minimal;
    error_log   /dev/stderr warn;
}
