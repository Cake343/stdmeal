# Buduje obraz i publikuje go w GitHub Container Registry.
#
#   docker pull ghcr.io/cake343/stdmeal:latest
#
# Obraz jest multi-arch (amd64 + arm64), bo homelab bywa Raspberry Pi.

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # Najpierw sprawdzamy, czy kontener w ogóle wstaje i odpowiada. Sam `docker
  # build` tego nie gwarantuje — konfiguracja nginksa jest czytana dopiero przy
  # starcie, więc literówka w niej przechodzi build i wywala się u użytkownika.
  smoke:
    name: Czy kontener działa
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Zbuduj lokalnie
        run: docker build -t stdmeal:smoke .

      - name: Konfiguracja nginksa jest poprawna
        run: docker run --rm stdmeal:smoke nginx -t

      - name: Kontener odpowiada
        run: |
          docker run -d --name smoke -p 8080:8080 stdmeal:smoke
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          echo "→ /healthz"
          test "$(curl -fsS http://localhost:8080/healthz)" = "ok"

          echo "→ strona się serwuje"
          curl -fsS http://localhost:8080/ -o page.html
          grep -q 'stdmeal' page.html
          grep -q '<style>' page.html

          echo "→ PWA: manifest, service worker i ikony"
          curl -fsS http://localhost:8080/manifest.webmanifest -o manifest.json
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          curl -fsSI http://localhost:8080/manifest.webmanifest | grep -qi 'application/manifest+json'
          curl -fsS http://localhost:8080/sw.js | grep -q "const VERSION = '"
          curl -fsS http://localhost:8080/assets/pwa/icon-512.png -o icon.png
          test "$(stat -c%s icon.png)" -gt 1000

          echo "→ nagłówki bezpieczeństwa"
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          curl -fsSI http://localhost:8080/ | grep -qi 'x-content-type-options'

          echo "→ kontener nie chodzi jako root"
          test "$(docker exec smoke id -u)" != "0"

          docker rm -f smoke

  image:
    name: Zbuduj obraz
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Przy pull requeście tylko budujemy — nie publikujemy.
      - name: Logowanie do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
