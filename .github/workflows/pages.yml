# Publikuje zbudowany jeden plik na GitHub Pages.
#
# Celowo TYLKO ręcznie (workflow_dispatch). Aplikacja docelowo chodzi
# w Dockerze w domowym labie, a Pages to publiczny adres w internecie —
# to decyzja, którą podejmuje się świadomie, a nie przy okazji pusha.
#
# Żeby włączyć:
#   1. Settings → Pages → Source: GitHub Actions
#   2. Actions → Pages → Run workflow
#
# Od tego momentu można dopisać tu wyzwalacz `push`, jeśli wersja
# publiczna ma nadążać za main.

name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nowszy push czeka, zamiast wyścigać się ze starszym.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Zbuduj i wdróż
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testy
        run: node --test

      - name: Build
        run: node tools/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
