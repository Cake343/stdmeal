# Publikuje aplikację na GitHub Pages — to jest główny sposób jej używania.
#
# Wdrażany jest ZBUDOWANY katalog dist/: jeden plik HTML plus manifest,
# service worker i ikony. Dzięki temu publiczna wersja to dokładnie to samo,
# co jedzie w kontenerze, i da się ją zainstalować jako aplikację.
#
# Wymaga raz ustawionego źródła: Settings → Pages → Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; nowszy push czeka, zamiast wyścigać się ze starszym.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Zbuduj i wdróż
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testy
        run: node --test

      - name: Build
        run: node tools/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
